name: CI — Whealth Planner Pro

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa-and-security-gate:
    name: TributarioEngine Suite (428 Tests) & Secret Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run unit tests, vm.Script syntax validation, and Secret Scanner
        run: node tests/tributario_engine.test.js
