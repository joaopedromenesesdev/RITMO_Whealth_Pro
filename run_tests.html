<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Suíte de Testes Automatizados — Whealth Planner Pro</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; line-height: 1.6; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 30px; max-width: 800px; margin: 0 auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h1 { color: #38bdf8; margin-top: 0; }
    .console-box { background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; font-family: monospace; font-size: 14px; white-space: pre-wrap; word-break: break-all; color: #a7f3d0; margin-top: 20px; }
    .btn-run { background: #2563eb; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; }
    .btn-run:hover { background: #1d4ed8; }
  </style>
  <script src="script/tributario_engine.js"></script>
  <script src="script/tributario_engine.test.js"></script>
</head>
<body>
  <div class="card">
    <h1>🧪 Suíte de Testes Automatizados</h1>
    <p>Validação da precisão matemática das regras tributárias (ITCMD), partilha de meação vs. herança e estratégias de preservação patrimonial.</p>
    
    <button class="btn-run" onclick="executarTestesVisual()">Executar Suíte de Testes</button>

    <div id="output" class="console-box">Clique no botão acima para iniciar os testes...</div>
  </div>

  <script>
    function executarTestesVisual() {
      const out = document.getElementById("output");
      out.textContent = "";

      // Sobrescreve console.log para exibir na tela
      const originalLog = console.log;
      const originalError = console.error;

      console.log = function(...args) {
        out.textContent += args.join(" ") + "\n";
        originalLog.apply(console, args);
      };

      console.error = function(...args) {
        out.textContent += args.join(" ") + "\n";
        originalError.apply(console, args);
      };

      if (window.rodarTestesTributario) {
        window.rodarTestesTributario();
      }

      console.log = originalLog;
      console.error = originalError;
    }

    // Executa automaticamente ao carregar
    window.addEventListener("DOMContentLoaded", executarTestesVisual);
  </script>
</body>
</html>
